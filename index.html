<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ece9e0" />
    <meta name="description" content="SPLAT! — прототип просторной тактической арены, этап S0." />
    <title>SPLAT! · S0</title>
    <link rel="icon" href="data:," />

    <main id="app" aria-label="Тактическая арена">
      <header class="hud">
        <dl class="counters" aria-label="Состав армии">
          <div class="counter">
            <dt><span class="blue-dot" aria-hidden="true"></span> Синие</dt>
            <dd id="agent-count">—</dd>
          </div>
          <div class="counter">
            <dt>Группы</dt>
            <dd id="group-count">—</dd>
          </div>
        </dl>
        <button id="restart" type="button" disabled>
          <span aria-hidden="true">↺</span> Заново
        </button>
      </header>
      <section id="arena" aria-label="Игровое поле" aria-describedby="hint"></section>
      <footer class="footer">
        <p id="hint" role="status">Подготовка поля…</p>
        <span class="stage-label">S0 · Прототип</span>
      </footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
