<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ece9e0" />
    <meta
      name="description"
      content="SPLAT! — тактическая игра об управлении группами и захвате территории."
    />
    <title>SPLAT!</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <main id="app" aria-label="Тактическая арена">
      <header class="hud">
        <dl class="counters" aria-label="Состав армии">
          <div class="counter">
            <dt><span class="blue-dot" aria-hidden="true"></span> Синие</dt>
            <dd id="agent-count">—</dd>
          </div>
          <div class="counter">
            <dt>Красные</dt>
            <dd id="red-count">—</dd>
          </div>
          <div class="counter">
            <dt>Территория</dt>
            <dd id="paint-progress">—</dd>
          </div>
          <div class="counter">
            <dt>1. Рубеж</dt>
            <dd id="checkpoint-status">—</dd>
          </div>
          <div class="counter">
            <dt>2. Финальная точка</dt>
            <dd id="objective-status">—</dd>
          </div>
          <div class="counter">
            <dt id="reinforcement-label">Ресурс</dt>
            <dd id="reinforcement-credits">0</dd>
          </div>
          <div class="counter">
            <dt>Группы</dt>
            <dd id="group-count">—</dd>
          </div>
        </dl>
        <button id="camera-left" type="button" aria-label="Камера влево">←</button>
        <button id="camera-right" type="button" aria-label="Камера вправо">→</button>
        <button id="cut" type="button" disabled>Разделить (X)</button>
        <button id="merge" type="button" aria-pressed="false">Объединить (M)</button>
        <button id="reinforce" type="button" disabled>Пополнить (R)</button>
        <details class="hazard-help">
          <summary>Опасности</summary>
          <p>
            Золотой квадрат замедляет. Красный ромб — мина. Пушки стреляют постоянно. Водоёмы
            непроходимы.
          </p>
        </details>
        <button id="tutorial-open" type="button" disabled>Как играть</button>
        <button id="restart" type="button" disabled>
          <span aria-hidden="true">↺</span> Заново
        </button>
      </header>
      <section id="arena" aria-label="Игровое поле" aria-describedby="hint">
        <div id="checkpoint-hint" hidden role="status" aria-live="polite"></div>
        <div id="outcome" hidden role="status" aria-live="polite">
          Победа! Рубеж и финальная точка взяты. Нажмите «Заново», чтобы повторить.
        </div>
      </section>
      <footer class="footer">
        <p id="hint" role="status">Подготовка поля…</p>
      </footer>
    </main>
    <dialog id="tutorial" aria-labelledby="tutorial-title" aria-describedby="tutorial-step">
      <header class="tutorial-bar">
        <h2 id="tutorial-title">Как играть</h2>
        <button id="tutorial-close" type="button" autofocus>Вернуться к игре</button>
      </header>
      <p id="tutorial-step" role="status"></p>
      <div id="tutorial-field" aria-label="Тренировочное поле"></div>
      <div class="tutorial-bar tutorial-actions">
        <button id="tutorial-split" type="button" disabled>Разделить (X)</button>
        <button id="tutorial-merge" type="button" aria-pressed="false" disabled>
          Объединить (M)
        </button>
        <button id="tutorial-restart" type="button" disabled>Начать урок заново</button>
      </div>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
